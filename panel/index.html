<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Briozzo">
  <title>Panel Briozzo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="panel.css?v=1">
</head>
<body>
  <header class="barra">
    <img src="../marca/bzzo-blanco.png" alt="Briozzo">
    <h1 id="titulo">Actividad</h1>
  </header>

  <main>
    <section id="actividad">
      <div class="herramientas">
        <label class="periodo">
          <span class="oculto">Período</span>
          <select id="periodo">
            <option value="7">7 días</option>
            <option value="30">30 días</option>
            <option value="90">90 días</option>
          </select>
        </label>
        <div class="vistas" role="group" aria-label="Forma de ver los datos">
          <button type="button" data-vista="linea" aria-label="Ver en líneas" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-9"/></svg>
          </button>
          <button type="button" data-vista="barras" aria-label="Ver en barras" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M12 20V5M19 20v-11"/></svg>
          </button>
          <button type="button" data-vista="tabla" aria-label="Ver en tabla" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>
        <button class="exportar" type="button" id="exportar">Exportar</button>
      </div>

      <p class="aviso" id="aviso" hidden>Todavía no hay datos. El conteo de visitas y consultas empieza cuando se conecte la base de datos.</p>
      <div class="tarjetas" id="tarjetas"></div>
    </section>

    <section id="catalogo" hidden>
      <div class="cifras" id="cifras"></div>

      <article class="tarjeta">
        <h2>Modelos por tipo</h2>
        <div class="filas" id="por-tipo"></div>
      </article>

      <article class="tarjeta">
        <h2>Modelos por color</h2>
        <div class="filas" id="por-color"></div>
      </article>

      <article class="tarjeta">
        <h2>Pendientes de cargar</h2>
        <ul class="pendientes" id="pendientes"></ul>
      </article>
    </section>
  </main>

  <nav class="pestanas" aria-label="Secciones del panel">
    <a href="#actividad">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-9"/></svg>
      Actividad
    </a>
    <a href="#catalogo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v5H4zM13 14h7v5h-7z"/></svg>
      Catálogo
    </a>
  </nav>

  <script src="../datos.js?v=17"></script>
  <script src="actividad.js?v=1"></script>
  <script src="panel.js?v=1"></script>
</body>
</html>
